name: Lembar Build

# Build aplikasi catatan Lembar (folder lembar/). Hasilnya diunduh dari tab "Actions" ->
# run yang bersangkutan -> bagian "Artifacts".
# - lembar-debug-apk: untuk dipasang langsung di HP/tablet.
# - lembar-release-aab: untuk diunggah ke Google Play Console. Hanya dibuat kalau secret
#   upload key sudah diisi (lihat lembar/PLAY_STORE.md). Tanpa secret, build rilis tetap
#   dijalankan untuk memastikan R8 tidak merusak apa pun, tapi AAB-nya tidak diunggah.

on:
  push:
    paths:
      - "lembar/**"
      - ".github/workflows/lembar-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.LEMBAR_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        # Paket default action ("tools") sudah dihapus dari repository Google, lihat android-build.yml.
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform & build-tools yang dibutuhkan
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: lembar
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lembar-debug-apk
          path: lembar/app/build/outputs/apk/debug/Lembar-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Decode upload keystore dari secret
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: lembar/app
        run: echo "${{ secrets.LEMBAR_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > lembar-upload.jks

      - name: Build AAB rilis
        working-directory: lembar
        env:
          LEMBAR_UPLOAD_KEYSTORE_PATH: ${{ env.HAS_UPLOAD_KEY == 'true' && 'lembar-upload.jks' || '' }}
          LEMBAR_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.LEMBAR_UPLOAD_KEYSTORE_PASSWORD }}
          LEMBAR_UPLOAD_KEY_ALIAS: ${{ secrets.LEMBAR_UPLOAD_KEY_ALIAS }}
          LEMBAR_UPLOAD_KEY_PASSWORD: ${{ secrets.LEMBAR_UPLOAD_KEY_PASSWORD }}
        run: |
          # Env var kosong dianggap "tidak ada" supaya build.gradle.kts jatuh ke debug key.
          if [ -z "$LEMBAR_UPLOAD_KEYSTORE_PATH" ]; then unset LEMBAR_UPLOAD_KEYSTORE_PATH; fi
          ./gradlew bundleRelease --stacktrace

      - name: Hapus keystore dari runner
        if: always()
        working-directory: lembar/app
        run: rm -f lembar-upload.jks

      - name: Upload AAB rilis
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lembar-release-aab
          path: lembar/app/build/outputs/bundle/release/Lembar-release.aab
          if-no-files-found: error
          retention-days: 90
